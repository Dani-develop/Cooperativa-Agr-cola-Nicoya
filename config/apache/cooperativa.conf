# C02: proxy inverso en Ubuntu, no dentro del contenedor WordPress.
<VirtualHost *:80>
    ServerName cooperativa.internal
    ServerAlias www.cooperativa.internal
    Redirect permanent / https://cooperativa.internal/
    ErrorLog ${APACHE_LOG_DIR}/cooperativa-error.log
    CustomLog ${APACHE_LOG_DIR}/cooperativa-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName cooperativa.internal
    ServerAlias www.cooperativa.internal

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/ssl/certs/cooperativa-nicoya.crt
    SSLCertificateKeyFile /etc/ssl/private/cooperativa/servidor.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:8082/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8082/

    <LocationMatch "^/(wp-config\.php|\.env|\.git)(/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/cooperativa-error.log
    CustomLog ${APACHE_LOG_DIR}/cooperativa-access.log combined
</VirtualHost>
