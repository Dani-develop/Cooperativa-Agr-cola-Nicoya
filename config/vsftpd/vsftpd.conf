# /etc/vsftpd.conf — Proyecto EIF4310 · Escenario 1 (Cooperativa Agrícola Nicoya)
# Aplicar con:   sudo cp vsftpd.conf /etc/vsftpd.conf && sudo systemctl restart vsftpd
# (Antes: sudo cp /etc/vsftpd.conf /etc/vsftpd.conf.bak si aún no existe backup)

# ================== ACCESO ==================
# Nadie entra sin cuenta y contraseña.
anonymous_enable=NO
# Se usan cuentas del sistema (integrantes del grupo).
local_enable=YES
# Usuarios duoños pueden subir archivos.
write_enable=YES

# ================== PERMISOS DE LO QUE SE SUBE ==================
# Con umask 022: los archivos subidos quedan 644 y las carpetas 755.
# Resultado: el que sube es dueño; los demás usuarios SOLO pueden leer.
# Esto impide que un integrante modifique el archivo de otro.
local_umask=022

# ================== ENJAULADO (chroot) ==================
# Cada integrante queda encerrado en SU /home/<usuario>:
# no puede navegar por el resto del sistema ni ver las carpetas
# de los otros integrantes. Aislamiento estructural.
chroot_local_user=YES
# NO se usa allow_writeable_chroot: cada /home/<usuario> pertenece
# a root:root con 755 (no escribible) y solo la subcarpeta "subida"
# pertenece al usuario. Es el patrón que practicamos en la Sesión 8.

# ================== REGISTRO Y MENSAJES ==================
xferlog_enable=YES
connect_from_port_20=YES
use_localtime=YES
ftpd_banner=FTP Cooperativa Agricola Nicoya - EIF4310

# ================== MODO PASIVO ==================
# Rango estándar. En la topología del laboratorio no hay firewall entre
# Cliente y Servidor, pero se documenta por si se publica en una red real.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# ================== AJUSTES BASE DE UBUNTU ==================
listen=NO
listen_ipv6=YES
pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
