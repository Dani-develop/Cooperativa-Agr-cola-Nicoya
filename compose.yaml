# C02/C03: WordPress y MariaDB. Apache termina TLS en el host.
# Las credenciales se guardan en .env, fuera de Git y con modo 600.
name: cooperativa-nicoya

services:
  bd:
    image: ${MARIADB_IMAGE:?Definir MARIADB_IMAGE en .env}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME:?Definir DB_NAME en .env}
      MARIADB_USER: ${DB_USER:?Definir DB_USER en .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - datos_bd:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aplicacion

  wordpress:
    image: ${WORDPRESS_IMAGE:?Definir WORDPRESS_IMAGE en .env}
    restart: unless-stopped
    depends_on:
      bd:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: bd:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?Definir DB_NAME en .env}
      WORDPRESS_DB_USER: ${DB_USER:?Definir DB_USER en .env}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://cooperativa.internal');
        define('WP_SITEURL', 'https://cooperativa.internal');
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'staging');
    ports:
      - "127.0.0.1:${HTTP_BACKEND_PORT:?Definir HTTP_BACKEND_PORT en .env}:80"
    volumes:
      - archivos_wordpress:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - aplicacion

volumes:
  datos_bd:
  archivos_wordpress:

networks:
  aplicacion:
    driver: bridge
